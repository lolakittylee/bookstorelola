<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Modify Book</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>

	<h1>Add Book</h1>
	<div>
		<form th:object="${book}" th:action="@{../save}" action="#" method="post">
			<table>
				<tr>
					<td><label for="author">Author</label>
						<input type="text" id="author" th:field="*{author}" />
					</td>
				</tr>
				<tr>
					<td><label for="title">Title</label>
						<input type="text" id="title" th:field="*{title}" />
					</td>
				</tr>
				<tr>
					<td><label for="isbn">ISBN</label>
						<input type="text" th:field="*{isbn}" />
					</td>
				</tr>
				<tr>
					<td><label for="publicationYear">Year</label>
						<input type="text" th:field="*{publicationYear}" />
					</td>
				</tr>
				<tr>
					<td><label for="price">Price</label>
						<input type="text" th:field="*{price}" />
					</td>
				</tr>

				<tr>
					<td>
						<label>Book Type:</label>
						<select th:field="*{bookType}">
							<option th:each="type : ${booktypes}" 
							th:value="${type.id}" 
							th:text="${type.name}">
							</option>
						</select>
					</td>
				</tr>

				<tr>
					<td>
						<label>Category:</label>
						<select th:field="*{category}">
							<option th:each="category : ${categories}" 
							th:value="${category.id}" 
							th:text="${category.name}">
							</option>
						</select>
					</td>
				</tr>

			</table>
			<input type="submit" value="Save"></input>
		</form>

		<a th:href="@{/booklist}">Back to Book List</a>
		
	</div>


</body>

</html>
