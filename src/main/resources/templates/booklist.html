<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
  </head>
<body style="padding-left: 40px;">
    <h1>Books</h1>
<form action="#" th:action="@{/showmodifyform}" th:object="${book}" method="post">
    <table class="table table-striped">
  <tr>
    <th>Id</th>
   <th>Author</th>
   <th>Title</th>
   <th>ISBN</th>
   <th>Year</th>
   <th>Price</th>
  </tr>
     <tr th:each = "book : ${books}">
       <td th:text="${book.id}"></td>
       <td th:text="${book.author}"></td>
       <td th:text="${book.title}"></td>
       <td th:text="${book.isbn}"></td>
       <td th:text="${book.publicationYear}"></td>
        <td th:text="${book.price}"></td>
        <td><a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a></td>
        <td><a  th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
     </tr>
</table>
<p><input class="btn btn-success" type="submit" value="Add Book" /></p>
</form>
</body>
</html>
